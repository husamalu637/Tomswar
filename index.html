<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة التشغيل | صدى الطفولة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --accent: #ff9800; --bg: #0b0f19; --card: #161e2e; }
        body { background-color: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; background: linear-gradient(135deg, #00d2ff, #3a7bd5); padding: 30px 0; text-align: center; }
        .main-container { max-width: 900px; width: 95%; margin: 20px auto; text-align: center; }
        .video-display-area { background: #000; border-radius: 20px; overflow: hidden; border: 3px solid var(--primary); margin-bottom: 30px; display: none; }
        .responsive-iframe { position: relative; padding-bottom: 56.25%; height: 0; }
        .responsive-iframe iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; background: var(--card); padding: 25px; border-radius: 20px; }
        .ep-btn { background: #252f44; color: white; border: 0; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .ep-btn.active { background: var(--accent); color: black; }
        .test-btn { background: #e91e63 !important; } /* لون مميز لحلقة عدنان ولينا */
    </style>
</head>
<body>

<header>
    <h1>🎬 مركز تجربة التشغيل</h1>
    <p>جرب الحلقة الأولى (عدنان ولينا) ثم جرب توم سوير</p>
</header>

<div class="main-container">
    <div id="videoPlayer" class="video-display-area">
        <div class="responsive-iframe">
            <iframe id="mainIframe" src="" frameborder="0" allowfullscreen="" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
        </div>
        <div id="episodeTitle" style="padding: 10px; background: var(--card); font-weight: bold;"></div>
    </div>

    <div class="episodes-grid" id="buttonsGrid">
        <button class="ep-btn test-btn" onclick="playTest('https://meyon.com.ye/videos/embed/1cb15e94-c5ef-4766-95fb-1d736a545d2e', 'عدنان ولينا - الحلقة 1', this)">🔹 تجربة عدنان ولينا</button>
    </div>
    
    <h3 style="margin-top: 30px;">حلقات توم سوير:</h3>
    <div class="episodes-grid" id="tomSawyerGrid"></div>
</div>

<script>
    const tomSawyerIds = [
        "75a6c1a8-8e6f-4740-9764-1e0e80261327", "b263309a-41d3-455b-80cb-2292025585f8", "f8ef324f-a790-482a-9f5b-df4d2d46e968"
        // أضفت أول 3 حلقات فقط للتجربة الآن
    ];

    const tsGrid = document.getElementById('tomSawyerGrid');
    const player = document.getElementById('videoPlayer');
    const iframe = document.getElementById('mainIframe');
    const titleDisp = document.getElementById('episodeTitle');

    // دالة التشغيل
    function playTest(url, title, btn) {
        // فتح الإعلان
        window.open('https://www.profitablecpmratenetwork.com/e41dj2h87?key=bef514b5ca3fa945e7a3b60e4a9ef21a', '_blank');
        
        player.style.display = 'block';
        iframe.src = url;
        titleDisp.innerText = title;

        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        player.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // بناء أزرار توم سوير
    tomSawyerIds.forEach((id, index) => {
        const btn = document.createElement('button');
        btn.className = 'ep-btn';
        btn.innerText = "توم سوير ح" + (index + 1);
        btn.onclick = function() {
            playTest("https://meyon.com.ye/videos/embed/" + id, "توم سوير - الحلقة " + (index + 1), btn);
        };
        tsGrid.appendChild(btn);
    });
</script>

</body>
</html>
