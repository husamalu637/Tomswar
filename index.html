<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدى الطفولة | مغامرات توم سوير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4caf50; /* لون أخضر مناسب لجو المغامرات */
            --accent: #ff9800;
            --bg: #0b0f19;
            --card: #161e2e;
        }
        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            padding: 30px 0;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .main-container {
            max-width: 900px;
            width: 95%;
            margin: 20px auto;
            text-align: center;
        }
        .video-display-area {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid var(--primary);
            margin-bottom: 30px;
            display: none; 
        }
        .responsive-iframe {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .responsive-iframe iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 12px;
            background: var(--card);
            padding: 20px;
            border-radius: 20px;
        }
        .ep-btn {
            background: #252f44;
            color: white;
            border: none;
            padding: 15px 0;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .ep-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }
        .ep-btn.active {
            background: var(--accent);
            color: black;
            box-shadow: 0 0 15px var(--accent);
        }
        footer {
            margin-top: 40px;
            padding: 20px;
            opacity: 0.5;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<header>
    <h1>🌳 مغامرات توم سوير</h1>
    <p>شاهد جميع الحلقات بجودة عالية HD</p>
</header>

<div class="main-container">
    <div id="videoPlayer" class="video-display-area">
        <div class="responsive-iframe">
            <iframe id="mainIframe" src="" frameborder="0" allowfullscreen="" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
        </div>
        <div id="episodeTitle" style="padding: 15px; background: var(--card); font-weight: bold;"></div>
    </div>

    <h3>قائمة الحلقات:</h3>
    <div class="episodes-grid" id="buttonsGrid"></div>
</div>

    const player = document.getElementById('videoPlayer');

    const titleDisp = document.getElementById('episodeTitle');

    ids.forEach((id, index) => {
        const btn = document.createElement('button');
        btn.className = 'ep-btn';
        btn.innerText = index + 1;
        btn.onclick = function() {

            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            player.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        grid.appendChild(btn);

</script>

<footer>جميع الحقوق محفوظة - صدى الطفولة &copy; 2026</footer>
</body>
</html>
