<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة هزيم الرعد | صدى الطفولة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ffc107; --bg: #0b0f19; --card: #161e2e; }
        body { background-color: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        .video-box { 
            width: 100%; max-width: 800px; background: #000; border-radius: 15px; 
            border: 3px solid var(--primary); overflow: hidden; box-shadow: 0 0 20px rgba(255, 193, 7, 0.2);
        }
        .responsive-iframe { position: relative; padding-bottom: 56.25%; height: 0; }
        .responsive-iframe iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .play-section { margin-top: 20px; }
        .btn-play { 
            background: var(--primary); color: black; border: none; padding: 15px 40px; 
            border-radius: 10px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-play:hover { transform: scale(1.05); background: #e0a800; }
    </style>
</head>
<body>

<header>
    <h1>⚡ هزيم الرعد HD</h1>
    <p>الحلقة التي اخترتها جاهزة للمشاهدة الآن</p>
</header>

<div class="video-box" id="playerArea" style="display: none;">
    <div class="responsive-iframe">
        <iframe id="mainVid" src="" frameborder="0" allowfullscreen="" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
    </div>
</div>

<div class="play-section">
    <button class="btn-play" onclick="startPlay()">▶ اضغط هنا لمشاهدة الحلقة</button>
</div>

<script>
    function startPlay() {
        // فتح رابط الإعلان الخاص بك أولاً
        window.open('https://www.profitablecpmratenetwork.com/e41dj2h87?key=bef514b5ca3fa945e7a3b60e4a9ef21a', '_blank');
        
        // إظهار الفيديو وتشغيل الرابط الذي يعمل
        document.getElementById('playerArea').style.display = 'block';
        document.getElementById('mainVid').src = "https://meyon.com.ye/videos/embed/5a68b5cb-55e3-413f-b4d7-03cfb43b084c";
        
        // تمرير الصفحة للفيديو بسلاسة
        document.getElementById('playerArea').scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
