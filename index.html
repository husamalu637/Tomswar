<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدى الطفولة | هزيم الرعد HD</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffc107; /* لون ذهبي لهزيم الرعد */
            --accent: #e91e63;
            --bg: #050a14;
            --card: #101828;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            padding: 40px 0;
            text-align: center;
            border-bottom: 4px solid var(--primary);
        }

        .main-container {
            max-width: 1000px;
            width: 95%;
            margin: 20px auto;
            text-align: center;
        }

        .video-display-area {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid var(--primary);
            box-shadow: 0 0 30px rgba(255, 193, 7, 0.3);
            margin-bottom: 30px;
            display: none; 
        }

        .responsive-iframe {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .responsive-iframe iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 12px;
            background: var(--card);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .ep-btn {
            background: #1f2937;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 0;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .ep-btn:hover {
            background: var(--primary);
            color: black;
            transform: translateY(-5px);
        }

        .ep-btn.active {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 15px var(--primary);
        }

        footer {
            margin-top: 50px;
            padding: 30px;
            opacity: 0.6;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<header>
    <h1>⚡ صدى الطفولة | هزيم الرعد</h1>
    <p>شاهد مغامرات هزيم الرعد كاملة بجودة عالية HD</p>
</header>

<div class="main-container">
    
    <div id="videoPlayer" class="video-display-area">
        <div class="responsive-iframe">
            <iframe id="mainIframe" src="" frameborder="0" allowfullscreen="" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
        </div>
        <div id="episodeTitle" style="padding: 15px; background: var(--card); font-weight: bold; color: var(--primary);"></div>

    <h3>قائمة الحلقات (1 - 52):</h3>
    <div class="episodes-grid" id="buttonsGrid"></div>

</div>
